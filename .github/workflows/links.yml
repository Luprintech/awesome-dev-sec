name: Check links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          # The site URL is excluded: on push it is checked while still deploying (404).
          args: >-
            --no-progress --accept 200,429
            --exclude "luprintech.github.io"
            "./**/*.md"
          fail: true
