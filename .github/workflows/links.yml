name: Check links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          # Excluded: our own site (checked while still deploying, so 404 on push)
          # and awesome.re (its server breaks lychee's HTTP/2 client; fine in browsers).
          args: >-
            --no-progress --accept 200,429
            --exclude "luprintech.github.io"
            --exclude "awesome.re"
            "./**/*.md"
          fail: true
